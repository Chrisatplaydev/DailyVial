const hero=`<img class="droplet-art" src="${ART.droplet}" alt="Your happy blue DailyVial droplet mascot surrounded by pastel confetti">`;
function chart(kind='weight'){const weights=state.weights.length?state.weights.map(x=>x.value):[187,186.4,185.8,185.9,184.6,183.7,182.4];const points=weights.slice(-7);const max=Math.max(...points)+1,min=Math.min(...points)-1;const p=points.map((v,i)=>`${15+i*300/Math.max(points.length-1,1)},${100-(v-min)/(max-min)*70}`);return `<svg class="chart" viewBox="0 0 330 132" role="img" aria-label="${kind==='weight'?'Weight trend':'Daily activity'} chart. ${state.weights.length?'Your entries':'Sample data'}."><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#acd3f3" stop-opacity=".55"/><stop offset="1" stop-color="#eaf4fc" stop-opacity="0"/></linearGradient></defs><path class="grid" d="M10 20h310M10 60h310M10 100h310"/><path d="M${p.join('L')}L315 105L15 105Z" fill="url(#area)"/><path d="M${p.join('L')}" fill="none" stroke="#80b3e3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${p.map(v=>`<circle cx="${v.split(',')[0]}" cy="${v.split(',')[1]}" r="3.5" fill="white" stroke="#80b3e3" stroke-width="2"/>`).join('')}${['T','F','S','S','M','T','W'].map((v,i)=>`<text x="${15+i*50}" y="128" text-anchor="middle">${v}</text>`).join('')}</svg>`}
function metrics(){return `<div class="metrics">${[['protein','coral',state.protein,120,'g','PROTEIN'],['fiber','green',state.fiber,30,'g','FIBER'],['water','blue',state.water,100,'oz','WATER']].map(([i,c,v,g,u,t])=>`<button class="metric ${c}" data-action="${i==='water'?'water':'nutrition'}">${icon(i)}<b style="color:var(--ink)">${v}</b><span>/${g}${u}</span><label>${t}</label></button>`).join('')}</div>`}
function weekly(){let content;if(slide===0)content=`<div class="between"><h3 class="row">${icon('weight')} Weight <span class="sub">(lbs)</span></h3><span class="eyebrow">${state.weights.length?'YOUR ENTRIES':'SAMPLE'}</span></div><div class="big-stat">${state.weights.length?escapeHtml(state.weights.at(-1).value):'182.4'} <small>lbs</small></div><div class="sub green">${state.weights.length?'Your latest weigh-in':'↓ 4.6 lbs this month'}</div>${chart()}`;if(slide===1)content=`<h3 class="row">${icon('protein')} Protein</h3><div class="big-stat">${state.protein}<small> / 120g today</small></div><div class="sub">A little closer to your daily goal.</div>${bars([44,68,52,80,60,72,55])}`;if(slide===2)content=`<h3 class="row">${icon('workout')} Activity</h3><div class="big-stat">6,482 <small>steps / day</small></div><div class="sub">Sample weekly activity</div>${bars([55,66,45,82,58,70,60])}`;if(slide===3)content=`<h3 class="row">${icon('smile')} Mood & energy</h3><div class="big-stat">${state.mood?['Low','Okay','Good','Great','Amazing'][state.mood-1]:'Feeling good'}</div><div class="sub">${state.mood?'Your latest check-in':'Take a moment to check in with yourself.'}</div><div style="font-size:35px;letter-spacing:12px;text-align:center;padding:15px 0">😌 🙂 😊</div>${btn('Check in','mood','primary small')}`;return `<div class="card padded">${content}</div><div class="dots">${Array.from({length:4},(_,i)=>`<button aria-label="Weekly summary ${i+1}" class="${slide===i?'active':''}" data-slide="${i}"></button>`).join('')}</div>`}
function bars(v){return `<div class="bars">${v.map((n,i)=>`<div><i style="height:${n}px"></i>${['T','F','S','S','M','T','W'][i]}</div>`).join('')}</div>`}
function home(){return `<div class="card"><div class="hero-art">${hero}</div><div class="hero-copy"><div class="eyebrow">YOUR DAILY COMPANION</div><h2>${state.medications.length?'A little care, every day.':'Welcome to DailyVial'}</h2><p>${state.medications.length?'Your routine, all in one place. Small steps add up to something good.':"Let’s add your first medication and make your daily routine a little easier."}</p>${btn(state.medications.length?'View today’s plan':'Add medication',state.medications.length?'dose':'medication','primary full')}</div></div>${metrics()}${section('This Week','progress')}${weekly()}<div class="card encourage"><div class="eyebrow">ONE DAY AT A TIME</div><h2>Small steps. Real progress.</h2><p>You don’t have to do it all today.<br>Just the next little thing.</p></div>`}
function dose(){return `<div class="card padded"><div class="between"><h3>Your routine</h3><span class="pill">This week</span></div><div class="big-stat">${state.doses.length} <small>doses logged</small></div><div class="sub">Keep track of your schedule, at your pace.</div><div style="display:flex;justify-content:space-between;padding:24px 3px 11px">${['T','F','S','S','M','T','W'].map((d,i)=>`<div style="text-align:center"><div style="border:2px solid ${i===6?'#80b3e3':'#dfeaf4'};background:${i===6&&state.doses.length?'#80b3e3':'#f7fbfe'};width:29px;height:29px;border-radius:50%;margin-bottom:9px;display:grid;place-items:center;color:white">${i===6&&state.doses.length?icon('check'):''}</div><span class="sub">${d}</span></div>`).join('')}</div></div><div class="two-col"><div class="card padded"><h2 style="font-size:21px;margin:0 0 3px">Today</h2><div class="sub">${new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</div><p class="sub">${state.medications.length?escapeHtml(state.medications[0].name):'No medication added yet'}</p>${btn(icon('syringe')+' Log dose','logdose','primary full small')}</div><div class="stack"><div class="card padded"><h3><span class="badge-icon">${icon('target')}</span>Injection site</h3><div class="sub">${state.doses.length?escapeHtml(state.doses.at(-1).site):'Site not recorded'}</div></div><div class="card padded"><h3><span class="badge-icon">${icon('clock')}</span>Last dose</h3><div class="sub">${state.doses.length?'Logged today':'Log your first dose'}</div></div></div></div><div class="card padded" style="margin-top:17px"><div class="between"><h3><span class="badge-icon">${icon('smile')}</span>How are you feeling?</h3>${btn(icon('edit')+' Log','mood','primary small')}</div><div class="sub">Check in with your mood and energy.</div></div>${section('Dose History','history')}<div class="card padded">${state.doses.length?state.doses.slice(-3).reverse().map(d=>`<div class="listrow"><span class="badge-icon">${icon('check')}</span><div><b>${escapeHtml(d.medication)}</b><span class="sub">${escapeHtml(d.amount)} · ${escapeHtml(d.site)}</span></div><span class="sub">Today</span></div>`).join(''):'<div class="empty">Your dose history will appear here.<br>A fresh start, one day at a time.</div>'}</div>${section('Medications','medication')}<div class="card padded">${state.medications.length?state.medications.map(m=>`<div class="listrow"><div class="med-vial"></div><div><b>${escapeHtml(m.name)}</b><div class="sub">${escapeHtml(m.amount||'Your personal routine')}</div></div>${btn(icon('plus'),'logdose','avatar')}</div>`).join(''):`<div class="listrow"><div class="med-vial"></div><div><b>Your routine starts here</b><div class="sub">Add your medication to get started</div></div>${btn(icon('plus'),'medication','avatar')}</div>`}</div>`}
function progress(){const w=state.weights.length?state.weights.at(-1).value:182.4;return `<div class="card padded"><div class="between"><div class="segment">${['W','M','3M','Y','All'].map(r=>`<button class="${range===r?'active':''}" data-range="${r}">${r}</button>`).join('')}</div>${btn(icon('plus')+' Log weight','weight','primary small')}</div><div class="big-stat">${w} <small>lbs</small></div><div class="between"><span class="sub">${state.weights.length?'Latest weigh-in':'Sample progress'}</span><span class="sub green">${state.weights.length?'':'↓ 4.6 lbs'}</span></div>${range==='W'?chart():trendChart(range)}<div style="text-align:center;margin-top:9px">${btn(icon('camera')+' Progress photos','photos','primary small')}</div></div><div class="card padded"><h3>A little closer to your goal</h3><div class="goal-track"><i></i><i></i><i></i><i></i></div><div class="between"><div class="sub">Your goal: <b>${state.goal} lbs</b></div>${btn('Edit goal','goal','primary small')}</div></div><div class="mini-pair"><div class="card"><div class="circle">${state.height?(w*703/(state.height**2)).toFixed(1):'—'}</div><div><div class="eyebrow">BMI</div>${btn(state.height?'Edit height':'Add height','height','sub coral')}</div></div><div class="card"><div class="circle">↓</div><div><div class="eyebrow">CHANGE</div><div class="sub" style="color:#c39253">${state.weights.length>1?(state.weights.at(-1).value-state.weights[0].value).toFixed(1)+' lbs':'Sample: −4.6 lbs'}</div></div></div></div><div class="card padded"><div class="eyebrow">ACTIVITY · SAMPLE</div><h3 style="margin-top:7px">A little movement goes a long way</h3><div class="track" style="background:#e8edf2;height:7px"><i style="width:64%"></i></div><div class="between sub" style="margin-top:5px"><span>6,482 daily average</span><span>Goal 10,000</span></div>${bars([34,56,45,60,42,50,55])}</div>${section('Workout','workout')}<div class="card padded"><h3 class="row">${icon('workout')} Workouts</h3><div class="sub">${state.workouts.length?state.workouts.length+' workouts logged':'Make time for what moves you.'}</div>${state.workouts.map(w=>`<div class="listrow"><b>${escapeHtml(w.name)}</b><span class="sub">${w.minutes} min</span></div>`).join('')}${btn('Log a workout '+icon('chevron'),'workout','sub blue')}</div>`}
function trendChart(r){const labels={M:['Week 1','Week 2','Week 3','Week 4'],'3M':['Aug','Sep','Oct'],Y:['Jan','Apr','Jul','Oct'],All:['Start','Milestone','Today']}[r];return `<svg class="chart" viewBox="0 0 330 132" role="img" aria-label="Sample ${r} weight trend"><path class="grid" d="M10 20h310M10 60h310M10 100h310"/><path d="M15 24Q60 35 80 48T150 55T220 80T315 100" fill="none" stroke="#80b3e3" stroke-width="3"/>${labels.map((v,i)=>`<text x="${25+i*275/(labels.length-1)}" y="128" text-anchor="middle">${v}</text>`).join('')}</svg>`}
const foods=[{name:'Chicken & avocado bowl',desc:'A colorful lunch idea',emoji:'🥗',cat:'Meals'},{name:'Yogurt & berry parfait',desc:'A little something sweet',emoji:'🫐',cat:'Snacks'},{name:'Grilled salmon plate',desc:'Dinner inspiration',emoji:'🍣',cat:'Meals'},{name:'Your favorite smoothie',desc:'Sip, enjoy, repeat',emoji:'🥤',cat:'Snacks'}];
function foodVisual(f){const src=f.name==='Chicken & avocado bowl'?ART.chicken:f.name==='Yogurt & berry parfait'?ART.parfait:null;return src?`<img src="${src}" alt="${escapeHtml(f.name)}" loading="lazy">`:`<span aria-hidden="true">${f.emoji}</span>`}
function foodCards(items=foods.slice(0,2)){return `<div class="food-grid">${items.map((f,i)=>`<button class="food-card" data-food="${foods.indexOf(f)}"><div class="food-image ${i%2?'peach':''}">${foodVisual(f)}</div><b>${f.name}</b><small>${f.desc}</small></button>`).join('')}</div>`}
function nutrition(){return `<div class="card padded"><div class="nutrition-top"><div class="ring" style="--protein-progress:${Math.min(100,state.protein/120*100)}%"><div>${icon('protein')}<b>${state.protein}</b><small>g</small><br><small>of 120g</small></div></div><div><div class="eyebrow">PROTEIN</div><h2 style="font-size:21px;margin:5px 0">${Math.max(0,120-state.protein)}g to go</h2><div class="sub">A little fuel for your day</div><div class="row" style="margin-top:14px;color:var(--green)">${icon('fiber')}<span class="sub"><b style="color:var(--ink)">${state.fiber}</b> / 30g fiber</span></div></div></div><div class="macro-grid">${[['bolt','Calories',state.meals.reduce((s,m)=>s+m.calories,0),2000,''],['water','Water',state.water,100,'oz'],['nutrition','Meals',state.meals.length,3,'']].map(([i,t,n,g,u])=>`<button class="macro" data-action="${i==='water'?'water':'meal'}"><div class="row sub">${icon(i)}${t}</div><b>${n}</b><span class="sub">/${g}${u}</span><div class="track"><i style="width:${Math.min(100,n/g*100)}%"></i></div></button>`).join('')}</div></div><div class="card padded"><div class="between"><h3>${state.meals.length?state.meals.length+' meals logged today':'Your food journal'}</h3>${btn('History '+icon('chevron'),'mealhistory','sub blue')}</div>${state.meals.map(m=>`<div class="listrow"><div><b>${escapeHtml(m.name)}</b><div class="sub">${m.calories} cal · ${m.protein}g protein</div></div></div>`).join('')}<div class="divider"></div>${btn(icon('plus')+' Add a meal','meal','row blue')}</div>${section('Quick actions')}<div class="quick-grid">${[['camera','Scan meal','scanmeal'],['scan','Scan barcode','barcode'],['menu','Scan menu','scanmenu'],['search','Search food','searchfood'],['clock','Recents','mealhistory'],['fiber','Food ideas','foodideas']].map(([i,t,a])=>btn(icon(i)+'<span>'+t+'</span>',a,'nutrition-action')).join('')}</div>${section('A little meal inspiration','foodideas')}${foodCards()}${section('This Week')}<div class="card padded"><div class="between"><h3>Your daily balance</h3><span class="sub">Sample week</span></div>${bars([43,52,65,60,40,68,57])}<div class="divider"></div><div class="between"><span class="sub">Make it yours</span>${btn('Edit goals','nutritiongoals','sub blue')}</div></div>`}
function community(){return `<div class="card"><div class="hero-art" style="height:162px;background:linear-gradient(120deg,#e2ecfc,#eee6fa)">${hero}</div><div class="hero-copy"><div class="eyebrow">BETTER, TOGETHER</div><h2>You’re in good company.</h2><p>A little encouragement for every part of your journey.</p>${btn('Share a small win','post','primary full')}</div></div>${section('The daily check-in')}<div class="card padded"><h3>How’s your day feeling?</h3><p class="sub">There’s no right answer. Just your answer.</p><div class="mood-grid">${['😔','😐','🙂','😊','🤩'].map((m,i)=>`<button aria-label="${['Low','Okay','Good','Great','Amazing'][i]}" data-mood="${i+1}" class="${state.mood===i+1?'selected':''}">${m}</button>`).join('')}</div></div>${section('Small wins')} ${state.posts.map((p,i)=>postCard('You','Just now',p,'user'+i)).join('')}${postCard('Jamie','Sample post','Went for a 15-minute walk today. Nothing huge, but I showed up for myself. 🌿','jamie')}${postCard('Morgan','Sample post','My little win: remembering to drink water between meetings. One habit at a time. 💧','morgan')}<p class="sub" style="text-align:center">Community preview · posts stay in this browser</p>`}
function postCard(n,t,p,id){return `<div class="card post"><div class="row"><span class="post-avatar">${n[0]}</span><div><b>${n}</b><div class="sub">${t}</div></div></div><p>${escapeHtml(p)}</p><button data-like="${id}" class="like ${state.likes.includes(id)?'liked':''}">${icon('heart')} ${state.likes.includes(id)?'Cheered on':'Send a little encouragement'}</button></div>`}
function render(reset=false){document.getElementById('title').innerHTML=page==='Home'?icon('dose')+'DailyVial':page;document.getElementById('streak').innerHTML=icon('bolt')+state.doses.length;document.querySelector('.avatar').innerHTML=icon('user');document.querySelector('.fab').innerHTML=icon('plus');document.getElementById('nav').innerHTML=['Home','Dose','Progress','Nutrition','Community'].map(p=>`<button data-page="${p}" class="${page===p?'active':''}" aria-current="${page===p?'page':'false'}">${icon(p.toLowerCase())}<span>${p}</span></button>`).join('');main.innerHTML=({Home:home,Dose:dose,Progress:progress,Nutrition:nutrition,Community:community})[page]();if(reset)main.scrollTop=0}
function navigate(p){page=p;closeSheet();render(true)}
function openSheet(title,html){returnFocus=document.activeElement;sheet.innerHTML=`<div class="handle"></div><div class="sheet-header"><h2 id="sheet-title">${title}</h2><button class="close" data-action="close" aria-label="Close dialog">${icon('close')}</button></div>${html}`;overlay.hidden=false;sheet.querySelector('input,textarea,select,button')?.focus()}
function closeSheet(){overlay.hidden=true;returnFocus?.focus();returnFocus=null}
function field(label,name,type='text',value='',extras=''){return `<label class="field" for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${escapeHtml(value)}" ${extras}>`}
function form(type,html,label='Save'){openSheet({medication:'Add medication',logdose:'Log a dose',weight:'Log weight',water:'Add water',goal:'Your weight goal',height:'Add height',meal:'Add a meal',workout:'Log a workout',post:'Share a small win',nutritiongoals:'Your nutrition goals'}[type]||'Your daily check-in',`<form data-form="${type}">${html}<p class="form-note">Design preview · entries stay in this browser.</p><button type="submit" class="primary full">${label}</button></form>`)}
function action(a){if(['home','dose','progress','nutrition','community'].includes(a))return navigate(a[0].toUpperCase()+a.slice(1));if(a==='close')return closeSheet();if(a==='quick'){openSheet('A little check-in',`<p class="quick-intro">What would you like to log?</p><div class="sheet-label">FOOD</div><div class="sheet-group">${[['camera','Meal scan','scanmeal'],['menu','Menu scan','scanmenu'],['scan','Barcode','barcode'],['search','Search','searchfood']].map(([i,t,a])=>btn(`<span class="action-circle">${icon(i)}</span><span class="action-name">${t}</span>`,a,'quick-tile')).join('')}</div><div class="sheet-label">YOUR ROUTINE</div><div class="sheet-group">${[['dose','Medication','medication'],['syringe','Dose','logdose'],['weight','Weight','weight'],['water','Water','water']].map(([i,t,a])=>btn(`<span class="action-circle">${icon(i)}</span><span class="action-name">${t}</span>`,a,'quick-tile')).join('')}</div>${btn(`<span class="checkin-icon">${icon('smile')}</span><span>Check in with yourself</span>${icon('chevron')}`,'mood','menu-checkin')}`);return}if(a==='medication'){form(a,field('Medication name','name','text','','required maxlength="60" placeholder="Your medication"')+field('Amount / strength (optional)','amount','text','','maxlength="40" placeholder="As prescribed"')+field('Next scheduled date (optional)','date','date'));return}if(a==='logdose'){if(!state.medications.length){action('medication');toast('Add your medication first.');return}form(a,`<label class="field" for="f-medication">Medication</label><select id="f-medication" name="medication">${state.medications.map(m=>`<option>${escapeHtml(m.name)}</option>`).join('')}</select>`+field('Amount taken','amount','text',state.medications[0].amount,'required maxlength="40" placeholder="Enter your prescribed amount"')+`<label class="field" for="f-site">Injection site</label><select id="f-site" name="site"><option>Not recorded</option><option>Abdomen — left</option><option>Abdomen — right</option><option>Thigh — left</option><option>Thigh — right</option><option>Upper arm — left</option><option>Upper arm — right</option><option>Not applicable</option></select>`,'Save dose');return}if(a==='weight')return form(a,field('Weight (lbs)','value','number','','required min="1" max="1500" step="0.1" placeholder="182.4"'));if(a==='water')return form(a,field('Water (oz)','value','number',8,'required min="1" max="1000" step="1"'),'Add water');if(a==='goal')return form(a,field('Goal weight (lbs)','value','number',state.goal,'required min="1" max="1500" step="0.1"'));if(a==='height')return form(a,field('Height (inches)','value','number',state.height||'','required min="12" max="120" step="0.1"'));if(a==='meal')return form(a,field('Meal name','name','text','','required maxlength="80" placeholder="What did you enjoy?"')+field('Calories','calories','number','','required min="0" max="20000" placeholder="0"')+field('Protein (g)','protein','number','','required min="0" max="1000" step="0.1" placeholder="0"')+field('Fiber (g)','fiber','number',0,'required min="0" max="1000" step="0.1"'));if(a==='workout')return form(a,field('Activity','name','text','','required maxlength="80" placeholder="Walk, yoga, strength…"')+field('Duration (minutes)','minutes','number',15,'required min="1" max="1440"'));if(a==='post')return form(a,`<label class="field" for="f-text">What’s your small win?</label><textarea id="f-text" name="text" maxlength="500" required placeholder="Today, I showed up for myself by…"></textarea>`,'Save to preview');if(a==='mood'){openSheet('How are you feeling?',`<p class="sub">Take a breath. Check in with yourself.</p><div class="mood-grid">${['😔','😐','🙂','😊','🤩'].map((m,i)=>`<button aria-label="${['Low','Okay','Good','Great','Amazing'][i]}" data-mood="${i+1}" class="${state.mood===i+1?'selected':''}">${m}</button>`).join('')}</div><p class="form-note">Tap a feeling to save your check-in.</p>`);return}if(a==='history'||a==='mealhistory'){const entries=a==='history'?state.doses:state.meals;openSheet(a==='history'?'Dose history':'Meal history',entries.length?entries.slice().reverse().map(e=>`<div class="listrow"><div><b>${escapeHtml(e.medication||e.name)}</b><div class="sub">${escapeHtml(e.amount||`${e.calories} cal · ${e.protein}g protein`)}</div></div><span class="sub">Today</span></div>`).join(''):`<div class="empty">No entries yet. Your next small step starts here.</div>${btn(a==='history'?'Log a dose':'Add a meal',a==='history'?'logdose':'meal','primary full')}`);return}if(a==='foodideas'||a==='searchfood'){filter='All';openFood(a==='searchfood');return}if(a==='photos'){openSheet('Progress photos',`<p class="sub">Keep a little record of your journey.</p><label class="field" for="photo">Choose a photo to preview</label><input type="file" id="photo" accept="image/*"><div id="photo-preview" style="margin-top:16px"></div><p class="form-note">Your photo is displayed locally for this preview.</p>`);return}if(['scanmeal','scanmenu','barcode'].includes(a)){openSheet({scanmeal:'Scan a meal',scanmenu:'Scan a menu',barcode:'Scan a barcode'}[a],`<div style="background:#edf4fb;border-radius:20px;padding:30px;text-align:center;color:var(--blue)">${icon(a==='barcode'?'scan':'camera')}</div><p class="sub">This is a design preview. Automatic scanning will need a camera and food database integration in the full app.</p>${btn('Add a meal manually','meal','primary full')}`);return}if(a==='profile'){openSheet('Your DailyVial',`<div class="row"><span class="post-avatar">${icon('user')}</span><div><b>Your daily companion</b><div class="sub">Interactive design preview</div></div></div><div class="divider"></div><p class="sub">Track a routine, celebrate small wins, and make a little space for yourself.</p><p class="form-note">Sample nutrition, activity, and chart values illustrate the design. Entries you add are stored locally in this browser.</p>${btn('Reset demo data','reset','pill full')}`);return}if(a==='reset'){localStorage.removeItem('dailyvial-demo-v1');location.reload();return}if(a==='nutritiongoals'){openSheet('Daily nutrition goals',`<div class="listrow"><div><b>Protein</b><div class="sub">120g per day · sample goal</div></div></div><div class="listrow"><div><b>Fiber</b><div class="sub">30g per day · sample goal</div></div></div><div class="listrow"><div><b>Water</b><div class="sub">100oz per day · sample goal</div></div></div><p class="form-note">Goal personalization is shown as a future full-app feature.</p>`);return}}
function openFood(search=false){openSheet('A little meal inspiration',`${search?'<label class="field" for="food-search">Search ideas</label><input id="food-search" placeholder="Try chicken, yogurt, salmon…">':''}<div class="filter-row" style="margin-top:15px">${['All','Meals','Snacks'].map(t=>`<button data-filter="${t}" class="${filter===t?'active':''}">${t}</button>`).join('')}</div><div id="food-results">${foodCards()}</div><p class="form-note">Illustrative meal ideas for this design preview.</p>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b){if(b.dataset.page)navigate(b.dataset.page);else if(b.dataset.action)action(b.dataset.action);else if(b.dataset.slide!==undefined){slide=+b.dataset.slide;render()}else if(b.dataset.range){range=b.dataset.range;render()}else if(b.dataset.mood){state.mood=+b.dataset.mood;save();closeSheet();render();toast('Your check-in is saved. A little care for yourself.')}else if(b.dataset.like){const id=b.dataset.like;state.likes=state.likes.includes(id)?state.likes.filter(x=>x!==id):[...state.likes,id];save();render()}else if(b.dataset.filter){filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter===filter));document.getElementById('food-results').innerHTML=foodCards(foods.filter(f=>filter==='All'||f.cat===filter))}else if(b.dataset.food!==undefined){const f=foods[+b.dataset.food];openSheet(f.name,`<div class="food-image food-detail-image">${foodVisual(f)}</div><p class="sub">${f.desc}. Save your own portion and nutrition details in your food journal.</p>${btn('Log this meal','meal','primary full')}`)}}else if(e.target===overlay)closeSheet()});
document.addEventListener('submit',e=>{const type=e.target.dataset.form;if(!type)return;e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(type==='medication')state.medications.push(d);if(type==='logdose')state.doses.push({...d,date:new Date().toISOString()});if(type==='weight')state.weights.push({value:+d.value,date:new Date().toISOString()});if(type==='water')state.water+=+d.value;if(type==='goal')state.goal=+d.value;if(type==='height')state.height=+d.value;if(type==='meal'){d.calories=+d.calories;d.protein=+d.protein;d.fiber=+d.fiber;state.meals.push(d);state.protein+=d.protein;state.fiber+=d.fiber}if(type==='workout')state.workouts.push(d);if(type==='post')state.posts.unshift(d.text);save();closeSheet();render();toast({medication:'Medication added. Your routine starts here.',logdose:'Dose saved. One little step, done.',weight:'Weight saved. Keep going at your pace.',water:'Water added. A little refresh.',meal:'Meal saved to your journal.',post:'Your small win is saved to the preview.'}[type]||'Saved. A little progress, every day.')});
document.addEventListener('input',e=>{if(e.target.id==='food-search'){const q=e.target.value.toLowerCase();const items=foods.filter(f=>(filter==='All'||f.cat===filter)&&f.name.toLowerCase().includes(q));document.getElementById('food-results').innerHTML=items.length?foodCards(items):'<div class="empty">No matching ideas. Try a different search.</div>'}});
document.addEventListener('change',e=>{if(e.target.id==='photo'&&e.target.files[0]){const file=e.target.files[0];if(!file.type.startsWith('image/'))return toast('Choose an image file.');const image=document.createElement('img');image.alt='Your progress photo preview';image.style='width:100%;max-height:250px;object-fit:contain;border-radius:16px';image.src=URL.createObjectURL(file);image.onload=()=>URL.revokeObjectURL(image.src);document.getElementById('photo-preview').replaceChildren(image)}});
document.addEventListener('keydown',e=>{if(overlay.hidden)return;if(e.key==='Escape')closeSheet();if(e.key==='Tab'){const nodes=[...sheet.querySelectorAll('button,input,textarea,select')].filter(x=>!x.disabled);const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();
</script></body></html>
